services:
  rm2027-sim:
    build: .
    container_name: rm2027-sim-server
    # 若需直接探测宿主机网卡、避免 NAT 影响 UDP 图传目标 IP，推荐使用 host 网络模式：
    # network_mode: host
    ports:
      - "3333:3333/tcp"
      - "18885:18885/tcp"
    volumes:
      - "./videos:/app/videos:ro"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "3333"
      - "--control-port"
      - "18885"
      - "--video-dir"
      - "/app/videos"
      - "--video-host"
      - "host.docker.internal"
      - "--video-port"
      - "3334"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
